services:
  backend:
    build:
      context: .
    environment:
      BIND_ADDR: 0.0.0.0:3030
      DC: docker
      POD: backend
      SERVICE: ddia-1
      CONTOUR: docker
    ports:
      - "127.0.0.1:3030:3030"
    restart: unless-stopped

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    command:
      - "-promscrape.config=/etc/victoria-metrics/promscrape.yml"
      - "-storageDataPath=/victoria-metrics-data"
    volumes:
      - ./victoria-metrics/promscrape.yml:/etc/victoria-metrics/promscrape.yml:ro
      - victoria-metrics-data:/victoria-metrics-data
    ports:
      - "127.0.0.1:8428:8428"
    depends_on:
      - backend
    restart: unless-stopped

  dashboard-generator:
    image: python:3.12-alpine
    command:
      - python
      - /app/generate_dashboard.py
      - --server-url
      - http://backend:3030
      - --output
      - /dashboards/endpoints.json
      - --wait-seconds
      - "60"
    volumes:
      - ./scripts/generate_dashboard.py:/app/generate_dashboard.py:ro
      - grafana-dashboards:/dashboards
    depends_on:
      - backend
    restart: "no"

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/endpoints.json
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      victoriametrics:
        condition: service_started
      dashboard-generator:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  victoria-metrics-data:
  grafana-data:
  grafana-dashboards:
