[package]
name = "resilience"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Composable async resilience strategies for DDIA homework 2"

[dependencies]
futures-util = "0.3.31"
http = "1.3"
httpdate = "1.0"
tokio = { version = "1.48", features = ["rt", "macros", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["test-util"] }
